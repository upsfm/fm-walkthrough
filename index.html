<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM Daily Walkthrough</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--brand:#CB4B2F;--ink:#18181B;--bg:#FAFAFA;--card:#fff;--muted:#71717A;--line:#E4E4E7;--ok:#15803D;--na:#71717A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;color:var(--ink);padding:10px 12px;position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;border-bottom:3px solid var(--brand)}
header .logo{height:30px;width:auto;display:block}
header .title{text-align:center}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .sub{font-size:11px;color:var(--muted)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--ink);color:#fff;font-size:12px;position:sticky;top:57px;z-index:4}
.navbar #whoSite{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbar .nav{display:flex;gap:6px;flex-shrink:0}
.navbar .nav button{padding:5px 9px;font-size:12px;background:transparent;color:#fff;border:1px solid #52525B;cursor:pointer}
@media (max-width:420px){header .logo{height:22px}header h1{font-size:15px}.navbar{top:51px}}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.btn{background:var(--brand);color:#fff;font-weight:600}
.btn2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.area{font-size:13px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.task{font-weight:600;margin-bottom:6px}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 4px;font-size:14px}
.seg button.on[data-v="OK"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on[data-v="Issue"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg button.on[data-v="NA"]{background:var(--na);color:#fff;border-color:var(--na)}
.warn{color:var(--brand);font-size:13px;margin-top:6px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--brand);width:0}
.hidden{display:none}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.pill.bad{background:#FBE9E5;border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body>
<header>
  <div><b style="color:var(--brand);font-size:20px;">UPS</b></div>
  <div class="title"><h1>FM Daily Walkthrough</h1><div class="sub">UPSPL Integrated Services</div></div>
  <div></div>
</header>
<div class="navbar" id="nav">
  <span id="whoSite"></span>
  <span class="nav"><button class="btn2" onclick="show('home')">Home</button><button class="btn2" onclick="show('settings')">Setup</button><button class="btn2" onclick="logout()">Logout</button></span>
</div>
<main>

<!-- LOGIN -->
<section id="login" class="hidden">
  <div class="card" style="max-width:420px;margin:24px auto">
    <div style="text-align:center;font-weight:700;font-size:18px;margin-bottom:4px">Contract Login</div>
    <div style="text-align:center;font-size:13px;color:var(--muted)">Select your contract and enter its 4-digit PIN.</div>
    <label>Contract</label><select id="loginSite"></select>
    <label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" onkeydown="if(event.key==='Enter')login()">
    <div id="loginErr" class="warn"></div>
    <div class="btnrow"><button class="btn" style="width:100%" onclick="login()">Login</button></div>
  </div>
</section>

<!-- HOME -->
<section id="home">
  <div class="card">
    <label>Contract / Site</label><select id="selSite" disabled></select>
    <div style="font-size:13px;color:var(--muted);margin-top:6px">Operations Manager: <b id="omName" style="color:var(--ink)"></b></div>
    <label>FM Name</label><select id="fmPick" onchange="pickFm()"></select><input id="selFm" list="fmNames" placeholder="Enter your name" style="margin-top:8px"><datalist id="fmNames"></datalist>
    <label>Date</label><input type="date" id="selDate">
    <div class="btnrow"><button class="btn" onclick="startWalk()">Start / Continue Walkthrough</button></div>
  </div>
  <div class="card">
    <div style="font-weight:700">Saved walkthroughs</div>
    <div id="history"></div>
  </div>
</section>

<!-- WALKTHROUGH -->
<section id="walk" class="hidden">
  <div class="card">
    <div id="walkHead" style="font-weight:700"></div>
    <div class="sub" id="walkCount" style="color:var(--muted);font-size:13px"></div>
    <div id="posMsg" style="font-size:13px;color:var(--muted);margin-top:4px"></div>
    <div class="prog"><div id="progBar"></div></div>
  </div>
  <div id="checks"></div>
  <div class="card">
    <div id="submitWarn" class="warn"></div>
    <div class="btnrow">
      <button class="btn2" onclick="saveWalk(false)">Save Draft</button>
      <button class="btn" onclick="saveWalk(true)">Submit</button>
    </div>
  </div>
</section>

<!-- REPORT -->
<section id="reportSec" class="hidden">
  <div class="btnrow" style="margin-bottom:12px">
    <button class="btn" onclick="window.print()">Download PDF</button>
    <button class="btn2" onclick="openWalkId(curReport.id)">Edit</button>
  </div>
  <div class="card" id="report"></div>
</section>

<!-- SETTINGS -->
<section id="settings" class="hidden">
  <div class="card">
    <div style="font-weight:700">Facility Managers</div>
    <div id="fmList"></div>
    <div class="btnrow"><input id="newFm" placeholder="Add FM name" style="flex:1"><button class="btn" onclick="addItem('fms','newFm')">Add</button></div>
  </div>
</section>

</main>
<script>
const CHECKLIST=[
["Main Gate & Security","Security guards present in full uniform, as per deployment"],
["Lobby & Common Areas","Lobby floor, glass and furniture clean"],
["Lifts","All lifts operational, no abnormal noise or jerks"],
["Electrical / Power","Transformer and HT/LT panel area clean, no tripping"],
["DG Set","DG fuel level adequate (record %)"],
["Water / Plumbing","Overhead and underground tank levels OK"],
["Housekeeping","Housekeeping staff present as per deployment"]
];

const SITES=[["RANI MEYYAMMAI-MS- Res-IFM", "Dhanasekar (USE 62456)"], ["AREL-AZURE-SAN- Res-Utility(TECH)", "Dhanasekar (USE 62456)"], ["ARTISTICA-SHO- Res-IFM", "Dhanasekar (USE 62456)"]];
const OM=Object.fromEntries(SITES);
const FM_BY_SITE={"AREL-AZURE-SAN- Res-Utility(TECH)": ["Mathivanan Panduvam"], "ARTISTICA-SHO- Res-IFM": ["Jayabalan"]};
const PIN_HASH={"RANI MEYYAMMAI-MS- Res-IFM": "1e45032b", "AREL-AZURE-SAN- Res-Utility(TECH)": "a6d785c4", "ARTISTICA-SHO- Res-IFM": "51f34fd2"};

function pinHash(pin,site){let x=2166136261;for(const ch of "UPS|"+site+"|"+pin){x^=ch.charCodeAt(0);x=Math.imul(x,16777619)>>>0}return x.toString(16).padStart(8,"0")}

let session=getCfg("session",null);
function login(){
  const site=$("loginSite").value,pin=$("loginPin").value.trim();
  if(!/^\d{4}$/.test(pin)){$("loginErr").textContent="Enter the 4-digit PIN.";return}
  session={site,at:Date.now()};setCfg("session",session);$("loginPin").value="";$("loginErr").textContent="";show("home");
}
function logout(){if(!confirm("Log out?"))return;session=null;try{localStorage.removeItem("session")}catch(e){};show("login")}

// Robust Storage with LocalStorage Fallback (Fixes SharePoint iframe IndexedDB restriction)
let db=null, useFallback=false;
function openDb(){
  return new Promise((res)=>{
    try {
      const r=indexedDB.open("fmWalk",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("walks",{keyPath:"id"});
      r.onsuccess=()=>{db=r.result;res()};
      r.onerror=()=>{useFallback=true;res()};
    } catch(e) {
      useFallback=true;
      res();
    }
  });
}

function putWalk(w){
  return new Promise((res)=>{
    if(useFallback||!db){
      let walks=getCfg("all_walks_fb",[]);
      walks=walks.filter(x=>x.id!==w.id);
      walks.push(w);
      setCfg("all_walks_fb",walks);
      res();
    } else {
      const r=db.transaction("walks","readwrite").objectStore("walks").put(w);
      r.onsuccess=res;
      r.onerror=()=>{useFallback=true;putWalk(w).then(res)};
    }
  });
}

function getWalk(id){
  return new Promise((res)=>{
    if(useFallback||!db){
      let walks=getCfg("all_walks_fb",[]);
      res(walks.find(x=>x.id===id)||null);
    } else {
      const tx=db.transaction("walks","readonly");
      const r=tx.objectStore("walks").get(id);
      r.onsuccess=()=>res(r.result||null);
      r.onerror=()=>res(null);
    }
  });
}

function delWalk(id){
  return new Promise((res)=>{
    if(useFallback||!db){
      let walks=getCfg("all_walks_fb",[]);
      walks=walks.filter(x=>x.id!==id);
      setCfg("all_walks_fb",walks);
      res();
    } else {
      const r=db.transaction("walks","readwrite").objectStore("walks").delete(id);
      r.onsuccess=res;
      r.onerror=()=>res();
    }
  });
}

function allWalks(){
  return new Promise((res)=>{
    if(useFallback||!db){
      res(getCfg("all_walks_fb",[]));
    } else {
      const r=db.transaction("walks","readonly").objectStore("walks").getAll();
      r.onsuccess=()=>res(r.result||[]);
      r.onerror=()=>res([]);
    }
  });
}

function getCfg(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function setCfg(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let cur=null,curReport=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(id){
  if(id!=="login"&&!session)id="login";
  $("nav").classList.toggle("hidden",id==="login");
  if(session)$("whoSite").textContent="Logged in: "+session.site;
  if(id==="login"){fillSelect($("loginSite"),[...SITES.map(r=>r[0])].sort());if(session)$("loginSite").value=session.site}
  ["login","home","walk","reportSec","settings"].forEach(s=>$(s).classList.toggle("hidden",s!==id));
  window.scrollTo(0,0);if(id==="home")renderHome();
}

function fillSelect(el,items){el.innerHTML=items.map(i=>`<option>${esc(i)}</option>`).join("")}

async function renderHome(){
  const sites=[...SITES.map(r=>r[0])].sort();
  fillSelect($("selSite"),sites);
  $("selSite").value=session?session.site:sites[0];
  const siteFms=FM_BY_SITE[session?.site]||["Other"];
  $("fmPick").innerHTML=siteFms.map(f=>`<option>${esc(f)}</option>`).join("");
  $("omName").textContent=OM[$("selSite").value]||"";
  if(!$("selDate").value)$("selDate").value=new Date().toISOString().slice(0,10);
  
  const walks=(await allWalks()).filter(w=>w.site===(session?.site)).sort((a,b)=>b.date.localeCompare(a.date));
  $("history").innerHTML=walks.length?walks.map(w=>`<div class="list-item"><div><b>${esc(w.site)}</b> - ${esc(w.date)}</div><div><button class="btn2" onclick="openWalkId('${w.id}')">Open</button></div></div>`).join(""):`<div style="color:var(--muted);font-size:13px;margin-top:6px">No walkthroughs yet.</div>`;
}

function pickFm(){const v=$("fmPick").value;if(v==="__other")$("selFm").classList.remove("hidden")}

async function startWalk(){
  const site=$("selSite").value,fm=$("fmPick").value,date=$("selDate").value,om=OM[site]||"";
  if(!site||!fm||!date){alert("Please select site and date");return}
  const id=`${site}|${date}`;
  let w=await getWalk(id);
  if(!w){
    w={id,site,om,fm,date,submitted:false,updated:Date.now(),items:CHECKLIST.map(([area,task])=>({area,task,obs:"",status:""}))};
    await putWalk(w);
  }
  openWalk(w);
}

function openWalk(w){
  cur=w;
  $("walkHead").textContent=`${w.site} (${w.date})`;
  let html="";
  w.items.forEach((it,idx)=>{
    html+=`<div class="card"><div class="area">${esc(it.area)}</div><div class="task">${esc(it.task)}</div>
    <div class="seg">
      <button class="${it.status==='OK'?'on':''}" data-v="OK" onclick="setStatus(${idx},'OK')">OK</button>
      <button class="${it.status==='Issue'?'on':''}" data-v="Issue" onclick="setStatus(${idx},'Issue')">Issue</button>
      <button class="${it.status==='NA'?'on':''}" data-v="NA" onclick="setStatus(${idx},'NA')">NA</button>
    </div></div>`;
  });
  $("checks").innerHTML=html;
  show("walk");
}

function setStatus(idx,val){
  cur.items[idx].status=val;
  openWalk(cur);
}

async function saveWalk(submit){
  cur.submitted=submit;
  cur.updated=Date.now();
  await putWalk(cur);
  alert(submit?"Submitted successfully!":"Draft saved!");
  show("home");
}

async function openWalkId(id){openWalk(await getWalk(id))}

window.addEventListener("DOMContentLoaded",async()=>{
  await openDb();
  show(session?"home":"login");
});
</script>
</body>
</html>
