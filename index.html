<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM Daily Walkthrough</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--brand:#CB4B2F;--ink:#18181B;--bg:#FAFAFA;--card:#fff;--muted:#71717A;--line:#E4E4E7;--ok:#15803D;--na:#71717A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;color:var(--ink);padding:10px 12px;position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;border-bottom:3px solid var(--brand)}
header .logo{height:30px;width:auto;display:block}
header .title{text-align:center}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .sub{font-size:11px;color:var(--muted)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--ink);color:#fff;font-size:12px;position:sticky;top:57px;z-index:4}
.navbar #whoSite{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbar .nav{display:flex;gap:6px;flex-shrink:0}
.navbar .nav button{padding:5px 9px;font-size:12px;background:transparent;color:#fff;border:1px solid #52525B}
@media (max-width:420px){header .logo{height:22px}header h1{font-size:15px}.navbar{top:51px}}
.who{font-size:13px;color:var(--muted);margin-bottom:10px}
.rpt-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--brand);padding-bottom:8px;margin-bottom:10px}
.rpt-head img{height:34px}
.rpt-head .t{flex:1;text-align:center;font-size:18px;font-weight:700}
.rpt-head .d{font-size:12px;color:var(--muted);text-align:right}
.summary h3{color:var(--brand);margin:18px 0 6px}
.signbox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:28px}
.signbox div{border-top:1px solid var(--ink);padding-top:4px;font-size:12px}
.remarks{border:1px solid var(--line);min-height:90px;border-radius:6px;margin-top:6px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.btn{background:var(--brand);color:#fff;font-weight:600}
.btn2{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.area{font-size:13px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.task{font-weight:600;margin-bottom:6px}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 4px;font-size:14px}
.seg button.on[data-v="OK"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on[data-v="Issue"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg button.on[data-v="NA"]{background:var(--na);color:#fff;border-color:var(--na)}
.seg button.on[data-v="Yes"],.seg button.on[data-v="No"],.seg button.on[data-v="High"],.seg button.on[data-v="Medium"],.seg button.on[data-v="Low"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.photo{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo label.btn,.photo label.btn2{padding:10px 14px;border-radius:8px;font-size:14px;cursor:pointer}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.carried{background:#FFF7F5;border-color:var(--brand)}
.prev{font-size:13px;color:var(--muted);margin-bottom:6px}
.prev img{display:block;width:72px;height:72px;object-fit:cover;border-radius:6px;margin:6px 0}
.warn{color:var(--brand);font-size:13px;margin-top:6px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--brand);width:0}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
th{background:var(--brand);color:#fff}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.pill.bad{background:#FBE9E5;border-color:var(--brand);color:var(--brand)}
#report img.ph{width:120px;height:120px;object-fit:cover}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:14mm 10mm 16mm 10mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:9pt;color:#71717A}@bottom-left{content:"FM Daily Walkthrough - UPS";font-size:9pt;color:#71717A}}
@media print{header,.noprint{display:none!important}body{background:#fff;font-size:11px}main{max-width:none;padding:0}.card{border:0;padding:0}
  .rpt-table{width:100%;border-collapse:collapse}.rpt-table>thead{display:table-header-group}.rpt-table>thead td,.rpt-table>tbody>tr>td{border:0;padding:0}
  tr{page-break-inside:avoid}.summary{page-break-before:always}#report img.ph{width:90px;height:90px}}
</style>
</head>
<body>
<header>
  <div><img class="logo logoImg" src="" alt="UPS"></div>
  <div class="title"><h1>FM Daily Walkthrough</h1><div class="sub">UPSPL Integrated Services</div></div>
  <div></div>
</header>
<div class="navbar noprint" id="nav">
  <span id="whoSite"></span>
  <span class="nav"><button class="btn2" onclick="show('home')">Home</button><button class="btn2" onclick="show('settings')">Setup</button><button class="btn2" onclick="logout()">Logout</button></span>
</div>
<main>

<!-- LOGIN -->
<section id="login" class="hidden">
  <div class="card" style="max-width:420px;margin:24px auto">
    <div style="text-align:center;margin-bottom:8px"><img class="logoImg" src="" alt="UPS" style="height:44px"></div>
    <div style="text-align:center;font-weight:700;font-size:18px;margin-bottom:4px">Contract Login</div>
    <div style="text-align:center;font-size:13px;color:var(--muted)">Select your contract and enter its 4-digit PIN.</div>
    <label>Contract</label><select id="loginSite"></select>
    <label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" onkeydown="if(event.key==='Enter')login()">
    <div id="loginErr" class="warn"></div>
    <div class="btnrow"><button class="btn" style="width:100%" onclick="login()">Login</button></div>
  </div>
</section>

<!-- HOME -->
<section id="home">
  <div class="card noprint" id="acctCard">
    <div id="acctInfo" style="font-size:14px"></div>
    <div class="btnrow"><button class="btn" id="btnSignIn" onclick="signIn()">Sign in with Microsoft</button><button class="btn2 hidden" id="btnSync" onclick="syncPending(true)">Upload pending</button><button class="btn2 hidden" id="btnSignOut" onclick="signOut()">Sign out</button></div>
  </div>
  <div class="card">
    <label>Contract / Site</label><select id="selSite" disabled></select>
    <div style="font-size:13px;color:var(--muted);margin-top:6px">Operations Manager: <b id="omName" style="color:var(--ink)"></b></div>
    <label>FM Name</label><select id="fmPick" onchange="pickFm()"></select><input id="selFm" list="fmNames" placeholder="Enter your name" style="margin-top:8px"><datalist id="fmNames"></datalist>
    <label>Date</label><input type="date" id="selDate">
    <div class="btnrow"><button class="btn" onclick="startWalk()">Start / Continue Walkthrough</button></div>
  </div>
  <div class="card">
    <div style="font-weight:700">Saved walkthroughs</div>
    <div id="history"></div>
  </div>
</section>

<!-- WALKTHROUGH -->
<section id="walk" class="hidden">
  <div class="card">
    <div id="walkHead" style="font-weight:700"></div>
    <div class="sub" id="walkCount" style="color:var(--muted);font-size:13px"></div>
    <div id="posMsg" style="font-size:13px;color:var(--muted);margin-top:4px"></div>
    <div class="prog"><div id="progBar"></div></div>
  </div>
  <div id="checks"></div>
  <div class="card noprint">
    <div id="submitWarn" class="warn"></div>
    <div class="btnrow">
      <button class="btn2" onclick="saveWalk(false)">Save Draft</button>
      <button class="btn" onclick="saveWalk(true)">Submit</button>
    </div>
  </div>
</section>

<!-- REPORT -->
<section id="reportSec" class="hidden">
  <div class="btnrow noprint" style="margin-bottom:12px">
    <button class="btn" onclick="window.print()">Download PDF</button>
    <button class="btn" id="btnShare" onclick="shareReport(curReport)">Share PDF</button>
    <button class="btn2" onclick="exportExcel(curReport)">Download Excel</button>
    <button class="btn2" onclick="openWalkId(curReport.id)">Edit</button>
  </div>
  <div id="syncMsg" class="warn noprint" style="margin-bottom:8px"></div>
  <div class="card" id="report"></div>
</section>

<!-- SETTINGS -->
<section id="settings" class="hidden">
  <div class="card">
    <div style="font-weight:700">Facility Managers</div>
    <div id="fmList"></div>
    <div class="btnrow"><input id="newFm" placeholder="Add FM name" style="flex:1"><button class="btn" onclick="addItem('fms','newFm')">Add</button></div>
  </div>
  <div class="card">
    <div style="font-weight:700">Export all</div>
    <div class="btnrow"><button class="btn2" onclick="exportAll()">Download all walkthroughs (Excel)</button></div>
  </div>
</section>

</main>

let session=getCfg("session",null);
function login(){
  const site=$("loginSite").value,pin=$("loginPin").value.trim();
  if(!/^\d{4}$/.test(pin)){$("loginErr").textContent="Enter the 4-digit PIN.";return}
  if(PIN_HASH[site]!==pinHash(pin,site)){$("loginErr").textContent="Wrong PIN for this contract.";return}
  session={site,at:Date.now()};setCfg("session",session);setCfg("lastSite",site);$("loginPin").value="";$("loginErr").textContent="";show("home");
}
function logout(){if(!confirm("Log out of this contract?"))return;session=null;try{localStorage.removeItem("session")}catch(e){};show("login")}
const STATUS_LABEL={OK:"OK",Issue:"Issue",NA:"Not Applicable"};
const CARRIED="Open issues carried forward";
const pad=n=>String(n).padStart(2,"0");
const fmtDate=s=>s?s.split("-").reverse().join("-"):"";
const fmtTime=t=>{if(!t)return"";const d=new Date(t);return`${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const gpsText=g=>g?`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} (within ${Math.round(g.acc)} m)`:"Not available";
let lastPos=null;
let posErr="",posTried=null;
function getPos(){return new Promise(res=>{
  if(!window.isSecureContext){posErr="Location is blocked because the app was opened as a file. Open it from its web link (https) to capture location.";return res(null)}
  if(!navigator.geolocation){posErr="This browser does not support location.";return res(null)}
  posErr="Getting location...";showPos();
  navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()};posErr="";res(lastPos)},
    e=>{posErr=e.code===1?"Location permission is denied. Allow location for this browser in phone Settings, then tap Retry.":e.code===3?"Location timed out. Turn on GPS and tap Retry.":"Location is unavailable. Turn on GPS and tap Retry.";res(null)},
    {enableHighAccuracy:true,timeout:20000,maximumAge:60000})})}
function showPos(){const el=$("posMsg");if(!el||!cur)return;
  el.innerHTML=cur.gps?`Location captured: ${gpsText(cur.gps)}`:`<span class="warn">${esc(posErr||"Location not captured yet.")}</span> <button class="btn2" style="padding:4px 10px;font-size:13px" onclick="capturePos()">Retry</button>`}
async function capturePos(){const w=cur;if(!w)return;const g=await getPos();if(g&&cur===w){cur.gps=g;await putWalk(cur);updateProg()}showPos()}

let db;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open("fmWalk",1);r.onupgradeneeded=()=>r.result.createObjectStore("walks",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode){return db.transaction("walks",mode).objectStore("walks")}
function putWalk(w){return new Promise((res,rej)=>{const r=tx("readwrite").put(w);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function getWalk(id){return new Promise(res=>{const r=tx("readonly").get(id);r.onsuccess=()=>res(r.result)})}
function delWalk(id){return new Promise((res,rej)=>{const r=tx("readwrite").delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
const isBlank=it=>it.area==="Others"&&!it.task.trim()&&!it.status&&!it.photo&&!it.obs.trim();
const used=w=>({...w,items:w.items.filter(it=>!isBlank(it))});
function allWalks(){return new Promise(res=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result||[])})}
function getCfg(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function setCfg(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let cur=null,curReport=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(id){if(id!=="login"&&!session)id="login";$("nav").classList.toggle("hidden",id==="login");if(session)$("whoSite").textContent="Logged in: "+session.site;if(id==="login"){fillSelect($("loginSite"),[...SITES.map(r=>r[0])].sort((a,b)=>a.localeCompare(b)));if(session)$("loginSite").value=session.site}
  ["login","home","walk","reportSec","settings"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);if(id==="home")renderHome();if(id==="settings")renderSettings()}

function fillSelect(el,items){el.innerHTML=items.map(i=>`<option>${esc(i)}</option>`).join("")}
async function renderHome(){
  const sites=[...SITES.map(r=>r[0])].sort((a,b)=>a.localeCompare(b)),fms=getCfg("fms",[]);
  fillSelect($("selSite"),sites);$("fmNames").innerHTML=fms.map(f=>`<option value="${esc(f)}">`).join("");
  $("selSite").value=session.site;
  const siteFms=FM_BY_SITE[session.site]||[],last=getCfg("lastFm","");
  $("fmPick").innerHTML=siteFms.map(f=>`<option>${esc(f)}</option>`).join("")+`<option value="__other">${siteFms.length?"Other (type name)":"Type your name"}</option>`;
  $("fmPick").value=siteFms.includes(last)?last:(siteFms.length&&!last?siteFms[0]:"__other");$("selFm").value=last;pickFm();$("omName").textContent=OM[$("selSite").value]||"";
  $("selSite").onchange=()=>{$("omName").textContent=OM[$("selSite").value]||""};
  if(!$("selDate").value)$("selDate").value=new Date().toISOString().slice(0,10);
  const walks=(await allWalks()).filter(w=>w.site===session.site).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated);
  $("history").innerHTML=walks.length?walks.map(w=>{
    w=used(w);const issues=w.items.filter(i=>i.status==="Issue").length,done=w.items.filter(i=>i.status).length;
    return `<div class="list-item"><div><div><b>${esc(w.site)}</b> · ${esc(w.date)}</div><div style="font-size:13px;color:var(--muted)">${esc(w.fm)} · ${done}/${w.items.length} checked · ${w.submitted?(w.synced?"Uploaded":"Submitted, not uploaded"):"Draft"}</div></div>
    <div style="display:flex;gap:6px;align-items:center">${issues?`<span class="pill bad">${issues} issue${issues>1?"s":""}</span>`:""}
    <button class="btn2" onclick="viewReport('${w.id}')">Report</button><button class="btn2" onclick="openWalkId('${w.id}')">Open</button><button class="btn2" onclick="deleteWalk('${w.id}')">Delete</button></div></div>`}).join(""):`<div style="color:var(--muted);font-size:13px;margin-top:6px">No walkthroughs yet.</div>`;
}

function pickFm(){const v=$("fmPick").value,o=v==="__other";$("selFm").classList.toggle("hidden",!o);if(!o)$("selFm").value=v}
async function startWalk(){
  const site=$("selSite").value,fm=$("selFm").value.trim(),date=$("selDate").value,om=OM[site]||"";
  if(!site||!fm||!date){alert("Please select the site and date, and enter your name.");return}
  setCfg("lastSite",site);setCfg("lastFm",fm);const fms=getCfg("fms",[]);if(!fms.includes(fm)){fms.push(fm);setCfg("fms",fms)}
  const id=`${site}|${date}`;
  let w=await getWalk(id);
  if(!w){
    w={id,site,om,fm,date,submitted:false,updated:Date.now(),checkIn:Date.now(),gps:null,items:CHECKLIST.map(([area,task])=>({area,task,obs:"",photo:"",status:""}))};
    const prev=(await allWalks()).filter(x=>x.site===site&&x.date<date).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated)[0];
    if(prev)w.items.unshift(...prev.items.filter(it=>it.status==="Issue"&&!it.afterPhoto).map(it=>({area:CARRIED,task:it.task,obs:"",photo:"",status:"",priority:it.priority||"",target:it.target||"",
      carried:{since:it.carried?it.carried.since:prev.date,from:prev.date,obs:it.obs||"",photo:it.photo||""}})));
    await putWalk(w);
  }
  openWalk(w);
}
async function deleteWalk(id){const w=await getWalk(id);if(!w||!confirm(`Delete the walkthrough for ${w.site} on ${w.date}? This cannot be undone.`))return;await delWalk(id);renderHome()}
async function openWalkId(id){openWalk(await getWalk(id))}
